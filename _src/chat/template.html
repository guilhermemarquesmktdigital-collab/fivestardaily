<style>
:root{--bg:#14102E;--card:#1E1840;--ink:#fff;--mute:#B9B2D8;--pink:#FF3D8B;--orange:#FF8A3D;--gold:#FFE08A}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#3a1d6b 0,var(--bg) 60%);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100%;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
a{color:var(--gold)}

.hd{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(10,6,24,.55);backdrop-filter:blur(8px)}
.hd .h1{font-size:17px;font-weight:700;margin:0;flex:1}

.list{flex:1;overflow:auto}
.ct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:rgba(10,6,24,.4);color:#fff;padding:14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.ct:hover,.ct:focus-visible{background:rgba(255,255,255,.07);outline:none}
.ct b{display:block;font-size:16px}.ct span{color:var(--mute);font-size:13.5px}
.soon{padding:16px 14px;color:#fff;opacity:.85;font-size:13.5px}
.msgs{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.b{max-width:80%;padding:9px 13px;border-radius:18px;font-size:15.5px;word-wrap:break-word;animation:pop .18s ease-out}
.b.t{align-self:flex-start;background:rgba(14,9,36,.78);border-bottom-left-radius:5px}

.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.ch .end{color:var(--mute);font-size:13.5px;margin-right:4px}
.note{width:100%;max-width:430px;text-align:center;color:var(--mute);font-size:12px;margin:10px 0 0}

.ch .end{color:#8a8a8e}
.inp{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.hbar{background:rgba(0,0,0,.75)}
.note{color:var(--mute)}
.lg button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:5px 9px;font:700 12px/1 inherit;cursor:pointer;margin-left:4px}.lg button.on{background:#fff;color:#14102E}
.bd{font-style:normal;flex:none;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font:700 12px/20px inherit;text-align:center;padding:0 6px}.ct .pv{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.ct.un b,.ct.un .pv{color:#000;font-weight:700}.ct .tx{flex:1;min-width:0}.sn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:4px 8px;font-size:14px;cursor:pointer;margin-left:4px}

.pic{display:block;width:230px;max-width:100%;border-radius:12px;overflow:hidden;line-height:0}.pic svg{width:100%;height:auto}.b.t:has(.pic){padding:4px;background:transparent}
@media (max-width:600px){body{padding:0 0 env(safe-area-inset-bottom)}.top{max-width:none;padding:8px 14px;margin:0;height:46px}.phone{max-width:none;flex:none;height:calc(100vh - 46px);height:calc(100dvh - 46px);max-height:none;border:0;border-radius:0;box-shadow:none}.sb{display:none}.note,.abt{padding-left:14px;padding-right:14px}}

N('lucia','getaway',{en:'The car you pick matters less than the road you pick.|Boring roads. Boring speeds.|Nobody chases a car that looks like it’s going to church.',es:'El auto que elijas importa menos que la ruta que elijas.|Rutas aburridas. Velocidades aburridas.|Nadie persigue un auto que parece ir a misa.',pt:'O carro que você escolhe importa menos que a estrada que escolhe.|Estradas chatas. Velocidades chatas.|Ninguém persegue um carro que parece estar indo para a igreja.'},[['secret','Where did you learn that?','¿Dónde aprendiste eso?','Onde você aprendeu isso?']]);
N('lucia','keep',{en:'Spend slow. Save fast.|The people who lose it all are the ones who need everyone to see they have it.',es:'Gasta lento. Ahorra rápido.|Los que lo pierden todo son los que necesitan que todos vean que lo tienen.',pt:'Gaste devagar. Guarde rápido.|Quem perde tudo é quem precisa que todo mundo veja que tem.'},[['risk','And the risk?','¿Y el riesgo?','E o risco?']]);
N('lucia','risk',{en:'Everything is a risk. Staying put is a risk too.|The question is who you’re doing it with.|Pick well.',es:'Todo es un riesgo. Quedarse quieto también lo es.|La pregunta es con quién lo haces.|Elige bien.',pt:'Tudo é risco. Ficar parado também é.|A pergunta é com quem você faz isso.|Escolha bem.'},[['trust','Who do you pick?','¿A quién eliges?','Quem você escolhe?']]);
N('lucia','trust',{en:'Trust is a muscle. I don’t flex it much.|But when I do, I don’t half do it.|Don’t make me regret it.',es:'La confianza es un músculo. No lo uso mucho.|Pero cuando lo hago, no lo hago a medias.|No me hagas arrepentirme.',pt:'Confiança é um músculo. Eu não uso muito.|Mas quando uso, não é pela metade.|Não me faça me arrepender.'},[['secret','What’s your secret?','¿Cuál es tu secreto?','Qual é o seu segredo?']]);
N('lucia','secret',{en:'Secret? I listen more than I talk.|People tell you everything when you let the silence do the work.|Try it. It’s free.',es:'¿Secreto? Escucho más de lo que hablo.|La gente te cuenta todo cuando dejas que el silencio haga el trabajo.|Pruébalo. Es gratis.',pt:'Segredo? Eu escuto mais do que falo.|As pessoas contam tudo quando você deixa o silêncio trabalhar.|Tenta. É de graça.'},[['story','Got a story to go with that?','¿Tienes una historia para acompañarlo?','Tem uma história para acompanhar?'],['plan','Okay. Back to the plan.','Vale. Volvamos al plan.','Certo. Voltando ao plano.']]);
N('lucia','story',{en:'One. Short.|I once waited four hours in a car for a man who never showed.|Best day of my month. Nobody got hurt, and I learned patience.|Now stop texting me. Go live a little.',es:'Una. Corta.|Una vez esperé cuatro horas en un auto a un hombre que nunca llegó.|El mejor día del mes. Nadie salió herido y aprendí paciencia.|Ahora deja de escribirme. Ve a vivir un poco.',pt:'Uma. Curta.|Uma vez esperei quatro horas num carro por um homem que nunca apareceu.|O melhor dia do mês. Ninguém se machucou e eu aprendi paciência.|Agora para de me mandar mensagem. Vai viver um pouco.'});

N('jason','serious',{en:'Serious. Okay. Deep breath.|I will carry the heavy thing, and I will not ask what’s inside.|That’s the most serious I get.',es:'En serio. Vale. Respira hondo.|Cargo lo pesado y no pregunto qué hay dentro.|Es lo más serio que me pongo.',pt:'Sério. Tá. Respira fundo.|Eu carrego a coisa pesada e não pergunto o que tem dentro.|Esse é o máximo de sério que eu fico.'},[['cut','And what’s my cut?','¿Y cuál es mi parte?','E qual é a minha parte?']]);
N('jason','cut',{en:'Your cut? Dinner. Maybe breakfast.|Hey, I’ve seen your taste in cars.|You’re getting a fair deal.',es:'¿Tu parte? La cena. Quizás el desayuno.|Oye, he visto tu gusto en autos.|Estás recibiendo un trato justo.',pt:'Sua parte? O jantar. Talvez o café da manhã.|Ei, já vi seu gosto para carros.|Você está levando um bom negócio.'},[['define','Fine. What’s “a little” again?','Vale. ¿Qué era “un poco”?','Tá. O que era “um pouco” mesmo?']]);
N('jason','define',{en:'A little is whatever fits in a duffel bag and a bad idea.|If you need a second bag, it’s not a little.|Then it’s a lifestyle.',es:'Un poco es lo que cabe en un bolso y una mala idea.|Si necesitas una segunda bolsa, ya no es un poco.|Es un estilo de vida.',pt:'Um pouco é o que cabe numa mochila e numa ideia ruim.|Se precisar de uma segunda mochila, já não é pouco.|Aí é estilo de vida.'},[['bored','Any tips for staying calm?','¿Algún consejo para mantener la calma?','Alguma dica para manter a calma?']]);
N('jason','helpboat',{en:'Sure. Hold this wrench. Don’t drop it in the water.|…You dropped it in the water.|Okay, that’s on me. I handed it to you.',es:'Claro. Sostén esta llave. No la dejes caer al agua.|…La dejaste caer al agua.|Vale, es mi culpa. Yo te la di.',pt:'Claro. Segura essa chave. Não deixa cair na água.|…Você deixou cair na água.|Tá, a culpa é minha. Eu que te dei.'},[['buyboat','Where did you buy this boat?','¿Dónde compraste este bote?','Onde você comprou esse barco?']]);
N('jason','buyboat',{en:'A guy. At a dock. At night.|He said, “She runs great.”|She runs. Great is a strong word.',es:'Un tipo. En un muelle. De noche.|Dijo: “Funciona de maravilla”.|Funciona. “De maravilla” es una palabra fuerte.',pt:'Um cara. Num cais. À noite.|Ele disse: “Ela anda que é uma beleza”.|Ela anda. “Beleza” é uma palavra forte.'},[['swim','So what’s plan B?','¿Y el plan B?','E o plano B?']]);
N('jason','swim',{en:'Plan B is a very motivated swim.|I have done it. I don’t recommend it.|The water tastes like regret and sunscreen.',es:'El plan B es nadar con muchas ganas.|Lo he hecho. No lo recomiendo.|El agua sabe a arrepentimiento y protector solar.',pt:'O plano B é nadar com muita motivação.|Eu já fiz. Não recomendo.|A água tem gosto de arrependimento e protetor solar.'});
N('jason','bored',{en:'Bored is a tool. Shoulders down, slow blink.|Look like you’re waiting for a bus that’s late.|Nobody questions the guy waiting for the bus.',es:'Aburrido es una herramienta. Hombros caídos, parpadeo lento.|Mira como si esperaras un bus que se atrasó.|Nadie cuestiona al tipo que espera el bus.',pt:'Entediado é uma ferramenta. Ombros caídos, piscar devagar.|Fica como quem espera um ônibus atrasado.|Ninguém questiona o cara esperando o ônibus.'},[['jobs','Okay. What jobs work like that?','Vale. ¿Qué trabajos funcionan así?','Tá. Que trabalhos funcionam assim?']]);

N('mandy','bring',{en:'A wrench, a good mood, and snacks.|Not the healthy kind. I can tell when you’re lying.|And maybe sunscreen. Hypothetically.',es:'Una llave inglesa, buen humor y snacks.|De los no saludables. Me doy cuenta cuando mientes.|Y quizá protector solar. Hipotéticamente.',pt:'Uma chave inglesa, bom humor e petiscos.|Dos não saudáveis. Eu percebo quando você mente.|E talvez protetor solar. Hipoteticamente.'},[['trap','This sounds like a trap.','Esto suena a trampa.','Isso parece uma armadilha.']]);
N('mandy','trap',{en:'A trap? Please. I’m not that organized.|If I wanted you trapped, I’d just stop texting back.|Works every time.',es:'¿Una trampa? Por favor. No soy tan organizada.|Si quisiera atraparte, dejaría de contestar.|Funciona siempre.',pt:'Armadilha? Por favor. Eu não sou tão organizada.|Se eu quisesse te prender, era só parar de responder.|Funciona sempre.'},[['mid','Okay. Different question.','Vale. Otra pregunta.','Tá. Outra pergunta.']]);
N('mandy','look',{en:'Look at it? Okay, listen to it first.|Drip. Drip. Gurgle. Sigh.|It’s a whole opera.',es:'¿Mirarlo? Vale, escúchalo primero.|Gota. Gota. Gorgoteo. Suspiro.|Es toda una ópera.',pt:'Olhar? Tá, escuta primeiro.|Pinga. Pinga. Gorgolejo. Suspiro.|É uma ópera inteira.'},[['like','You’re dramatic.','Eres dramática.','Você é dramática.']]);
N('mandy','like',{en:'What do I like? Long afternoons, loud music, and being right.|Mostly being right.|Your turn. What’s your favorite thing?',es:'¿Qué me gusta? Tardes largas, música alta y tener razón.|Sobre todo tener razón.|Tu turno. ¿Cuál es tu cosa favorita?',pt:'Do que eu gosto? Tardes longas, música alta e ter razão.|Principalmente ter razão.|Sua vez. Qual é a sua coisa favorita?'},[['story','Tell me a story instead.','Mejor cuéntame una historia.','Me conta uma história.']]);
N('mandy','takeme',{en:'Take you with me? You’d have to keep up.|I move fast. I get bored faster.|But you’re not boring. Yet.',es:'¿Llevarte conmigo? Tendrías que seguirme el ritmo.|Me muevo rápido. Me aburro más rápido.|Pero no eres aburrido. Todavía.',pt:'Te levar comigo? Você teria que acompanhar.|Eu ando rápido. Me entedio mais rápido.|Mas você não é chato. Ainda.'},[['maybe','Challenge accepted.','Reto aceptado.','Desafio aceito.']]);
N('mandy','maybe',{en:'“Maybe.” The most dangerous word in English.|I’ll take it.|Don’t make me wait, though. I get dramatic.',es:'“Quizás”. La palabra más peligrosa del idioma.|La acepto.|Pero no me hagas esperar. Me pongo dramática.',pt:'“Talvez”. A palavra mais perigosa que existe.|Eu aceito.|Mas não me faz esperar. Eu fico dramática.'},[['story','Fine. Tell me a story while I decide.','Bien. Cuéntame una historia mientras decido.','Tá. Me conta uma história enquanto eu decido.']]);
N('mandy','story',{en:'One story. Once I convinced a whole bar I was a famous singer.|Free drinks all night. Then someone asked me to sing.|I did. We were asked to leave.|Worth it.',es:'Una historia. Una vez convencí a todo un bar de que era cantante famosa.|Tragos gratis toda la noche. Luego alguien me pidió cantar.|Canté. Nos pidieron que nos fuéramos.|Valió la pena.',pt:'Uma história. Uma vez convenci um bar inteiro de que eu era cantora famosa.|Drinks de graça a noite toda. Aí alguém pediu para eu cantar.|Eu cantei. Pediram para a gente sair.|Valeu a pena.'});
N('mandy','mid',{en:'My middle name? Trouble.|It’s on the birth certificate. I have a very strict mother.|Now you owe me one. What’s yours?',es:'¿Mi segundo nombre? Problemas.|Está en el acta de nacimiento. Tengo una madre muy estricta.|Ahora me debes una. ¿Cuál es el tuyo?',pt:'Meu nome do meio? Encrenca.|Está na certidão. Eu tenho uma mãe muito rígida.|Agora você me deve uma. Qual é o seu?'});

var L='{{LANG}}';try{localStorage.setItem('fsd.lang',L)}catch(e){}
function tk(){var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);document.getElementById('clk').textContent=(h%12||12)+':'+m;}tk();setInterval(tk,20000);
var SEEN=[];try{SEEN=JSON.parse(localStorage.getItem('fsd.cs')||'[]')}catch(e){}
var SND=true;try{SND=localStorage.getItem('fsd.snd')!=='0'}catch(e){}
var AC=null;
function ping(){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[[880,0],[1318,.11]].forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=n[0];g.gain.setValueAtTime(0.0001,t+n[1]);g.gain.exponentialRampToValueAtTime(.12,t+n[1]+.015);g.gain.exponentialRampToValueAtTime(.0001,t+n[1]+.32);o.connect(g);g.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+.34);});}catch(e){}}
function mark(k){if(SEEN.indexOf(k)<0){SEEN.push(k);try{localStorage.setItem('fsd.cs',JSON.stringify(SEEN))}catch(e){}}}
var ph=document.getElementById('ph'),cur=null,busy=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clk(){var d=new Date(),m=('0'+d.getMinutes()).slice(-2),h=d.getHours();if(L==='en'){return (h%12||12)+':'+m+(h<12?' AM':' PM')}return h+':'+m;}
function home(){cur=null;
 ph.innerHTML='<div class="hd"><div class="h1">'+U[L].msgs+'<small>'+U[L].tap+'</small></div></div><div class="list">'+Object.keys(C).map(function(k){var c=C[k];var un=SEEN.indexOf(k)<0;return '<button class="ct'+(un?' un':'')+'" data-k="'+k+'"><div class="av '+c.cls+'" aria-hidden="true">'+c.i+'</div><div class="tx"><b>'+c.n+'</b><span class="pv">'+esc(un?c.s.start[L].say[0]:c.sub[L])+'</span></div>'+(un?'<i class="bd" aria-label="1">1</i>':'')+'</button>'}).join('')+'<div class="soon">'+U[L].soon+'</div></div>';}
function open(k){cur=k;var c=C[k];mark(k);
 ph.innerHTML='<div class="hd chatpg"><button class="back" data-back aria-label="Back">&lsaquo;</button><div class="av '+c.cls+'" aria-hidden="true">'+c.i+'</div><div class="nm">'+c.n+' <i>&rsaquo;</i></div></div><div class="msgs" id="ms" aria-live="polite"><div class="stamp">'+U[L].today+' '+clk()+'</div></div><div class="ch"><div class="opts" id="ch"></div><div class="inp" aria-hidden="true"><i>+</i><span>'+U[L].msg+'</span></div></div>';
 node('start');}
function add(t,cls,html){var m=document.getElementById('ms'),d=document.createElement('div');d.className='b '+cls;if(html)d.innerHTML=html;else d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;return d;}
function node(id){var c=C[cur],n=c.s[id][L],ch=document.getElementById('ch'),ms=document.getElementById('ms');busy=true;ch.innerHTML='';var i=0;
 (function next(){if(i>=n.say.length){fin();return;}
  var ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';ms.appendChild(ty);ms.scrollTop=ms.scrollHeight;
  var d=n.say[i]==='[[IMG]]'?1600:Math.min(1400,500+n.say[i].length*22);
  setTimeout(function(){ty.remove();if(n.say[i]==='[[IMG]]'){add('','t','<span class="pic">'+PIC+'</span>');}else add(n.say[i],'t');ping();i++;next();},d);})();
 function fin(){busy=false;
  if(n.link){add('','t','<a href="/map/">'+esc(U[L].map)+' &rarr;</a>');}
  if(n.end){ch.innerHTML='<span class="end">'+U[L].end+'</span><button data-again>'+U[L].again+'</button><button data-back>'+U[L].all+'</button>';}
  else{ch.innerHTML=n.ch.map(function(x){return '<button data-n="'+x[1]+'">'+esc(x[0])+'</button>'}).join('');}}}
document.querySelector('.phone').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.k){open(b.dataset.k);return;}
 if(b.hasAttribute('data-back')){home();return;}
 if(b.hasAttribute('data-again')){open(cur);return;}
 if(b.dataset.n&&!busy){add(b.textContent,'m');node(b.dataset.n);}});
var sn=document.getElementById('sn');function sbtn(){sn.textContent=SND?'🔔':'🔕';sn.setAttribute('aria-pressed',SND)}
sn.addEventListener('click',function(){SND=!SND;try{localStorage.setItem('fsd.snd',SND?'1':'0')}catch(e){}sbtn();if(SND)ping();});sbtn();
home();
</script>
