name: Hourly refresh
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch videos, lives and news
        run: python3 .github/scripts/update.py
      - name: Save if anything changed
        run: |
          git config user.name "fsd-bot"
          git config user.email "fsd-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || (git commit -m "Hourly refresh" && git push)
