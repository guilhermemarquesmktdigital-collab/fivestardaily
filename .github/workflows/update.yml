name: Hourly refresh
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch videos, lives and news
        run: python3 .github/scripts/update.py
      - name: Save if anything changed
        id: save
        run: |
          git config user.name "fsd-bot"
          git config user.email "fsd-bot@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then echo "changed=0" >> $GITHUB_OUTPUT; else git commit -m "Hourly refresh" && git push && echo "changed=1" >> $GITHUB_OUTPUT; fi
      - name: Tell Bing (IndexNow) the news and videos pages changed
        if: steps.save.outputs.changed == '1'
        run: |
          K=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          [ -n "$K" ] && curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' \
            -d "{\"host\":\"fivestardaily.com\",\"key\":\"$K\",\"urlList\":[\"https://fivestardaily.com/\",\"https://fivestardaily.com/news/\",\"https://fivestardaily.com/videos/\",\"https://fivestardaily.com/live/\"]}" || true
