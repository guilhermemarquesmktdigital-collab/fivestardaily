name: Rebuild site
on:
  push:
    branches: [main]
    paths:
      - '_src/air/news.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash _src/build.sh
      - name: Commit if changed
        run: |
          git config user.name "fsd-bot"
          git config user.email "fsd-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Rebuild site (admin edit)" && git push; fi
